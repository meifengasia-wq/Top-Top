name: Build TopTop APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Extract TopTop source
        run: |
          rm -rf SwipeFlowLite
          unzip -q TopTop_Source.zip
          test -f SwipeFlowLite/settings.gradle
          test -f SwipeFlowLite/app/build.gradle

      - name: Build debug APK
        working-directory: SwipeFlowLite
        run: gradle --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: TopTop-APK
          path: SwipeFlowLite/app/build/outputs/apk/debug/app-debug.apk
